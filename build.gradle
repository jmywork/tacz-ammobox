plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '0.4.0-hotfix'
group = 'com.taczammobox'
archivesBaseName = 'taczammobox-1.20.1'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            mods {
                taczammobox {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run-server')
            args '--nogui'
            mods {
                taczammobox {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven { url = uri('local-maven') }
    mavenCentral()
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/mirror' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.19'
    compileOnly files('libs/tacz-forge-1.20.1-1.2.0.jar')
    runtimeOnly files('libs/tacz-forge-1.20.1-1.2.0.jar')
    // Optional overlays; classes are only loaded by Jade/WTHIT when installed.
    compileOnly files('libs/Jade-1.20.1-Forge-11.13.3.jar')
    compileOnly files('libs/wthit-1.20.1-forge-8.21.1.jar')
    // Optional Curios equipped-slot search; loaded only when Curios is installed.
    compileOnly files('libs/curios-forge-5.14.1+1.20.1.jar')
    // Optional JEI recipe categories; only loaded when JEI is installed.
    compileOnly files('libs/jei-1.20.1-forge-15.59.0.210.jar')

    // Optional Create compat (deployer filling). Only loaded when Create is installed.
    compileOnly(fg.deobf('com.simibubi.create:create-1.20.1:6.0.8-289:slim')) { transitive = false }
    compileOnly fg.deobf('net.createmod.ponder:Ponder-Forge-1.20.1:1.0.91')
    compileOnly fg.deobf('dev.engine-room.flywheel:flywheel-forge-api-1.20.1:1.0.5')

    // Mixin annotation processor: rewrites @Inject/@Shadow names of vanilla members into
    // the SRG names present at runtime and emits a refmap. Mod-to-mod mixins keep their
    // own names and need no mapping.
    annotationProcessor 'org.spongepowered:mixin:0.8.5'
    // The mixin processor reads/writes its refmap with Gson; the processor classpath is
    // isolated from the normal one. Both jars ship with the machine's Gradle cache, but
    // this build runs offline, so they live in libs/ like the other compileOnly jars.
    annotationProcessor files(
            'libs/gson-2.10.1.jar',
            'libs/guava-31.1-jre.jar',
            'libs/asm-9.7.1.jar',
            'libs/asm-tree-9.7.1.jar',
            'libs/asm-util-9.7.1.jar',
            'libs/asm-analysis-9.7.1.jar',
            'libs/asm-commons-9.7.1.jar')
}

def refmapFile = file("$buildDir/resources/main/taczammobox.refmap.json")
def srgMappings = file("$buildDir/createMcpToSrg/output.tsrg")

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    dependsOn 'createMcpToSrg'
    options.compilerArgs += [
            "-AoutRefMapFile=${refmapFile.absolutePath}",
            "-AmappingTypes=tsrg",
            "-AdefaultObfuscationEnv=searge",
            "-AreobfTsrgFile=${srgMappings.absolutePath}"
    ]
}

processResources {
    inputs.property 'version', project.version
    // Non-ASCII text in mods.toml (the Chinese display name) must survive token
    // expansion; without this Gradle reads/writes with the platform charset.
    filteringCharset = 'UTF-8'
    filesMatching('META-INF/mods.toml') {
        expand 'version': project.version
    }
}

jar {
    from('LICENSE') {
        into 'META-INF'
    }
    manifest {
        attributes([
                'Specification-Title'    : 'taczammobox',
                'Specification-Vendor'   : 'jmywork',
                'Specification-Version'  : '1',
                'Implementation-Title'   : project.name,
                'Implementation-Version' : project.version,
                'Implementation-Vendor'  : 'jmywork',
                'MixinConfigs'           : 'taczammobox.mixins.json'
        ])
    }
}
